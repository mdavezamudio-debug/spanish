<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f4ec">
    <title>A1 Spanish Practice Deck</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
        --paper: #f7f4ec;
        --ink: #202a25;
        --muted: #71786e;
        --green: #315b45;
        --green-deep: #234432;
        --coral: #d9654e;
        --yellow: #efc965;
        --line: #deded2;
        --white: #fffefa;
        --serif: "Fraunces", Georgia, serif;
        --sans: "DM Sans", "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background-color: var(--paper);
        background-image: radial-gradient(#315b4512 0.7px, transparent 0.7px);
        background-size: 9px 9px;
        font-family: var(--sans);
      }

      button { font: inherit; }

      .page {
        width: min(100% - 40px, 760px);
        min-height: 100vh;
        margin: 0 auto;
        padding: 36px 0 28px;
        display: flex;
        flex-direction: column;
      }

      .topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 22px;
        border-bottom: 1px solid var(--line);
      }

      .wordmark {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--green-deep);
        font-size: 0.77rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .wordmark-icon {
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border-radius: 50%;
        color: var(--white);
        background: var(--coral);
        font-family: var(--serif);
        font-size: 1rem;
      }

      .level {
        padding: 7px 11px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--green-deep);
        background: #fffefa9c;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.06em;
      }

      main {
        width: min(100%, 520px);
        margin: auto;
        padding: 45px 0 38px;
        animation: arrive 500ms ease-out both;
      }

      .intro { margin-bottom: 28px; }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--coral);
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: var(--serif);
        font-size: 2.5rem;
        font-weight: 600;
        line-height: 1.08;
      }

      .subtitle {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .progress-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 600;
      }

      .progress-track {
        height: 5px;
        overflow: hidden;
        border-radius: 5px;
        background: #e5e4d9;
      }

      .progress-fill {
        width: 5%;
        height: 100%;
        border-radius: inherit;
        background: var(--coral);
        transition: width 240ms ease;
      }

      .card-wrap {
        height: 290px;
        margin-top: 18px;
        perspective: 1200px;
      }

      .flashcard {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 0;
        border: 1px solid #deded2;
        border-radius: 8px;
        color: inherit;
        background: transparent;
        cursor: pointer;
        text-align: center;
        transform-style: preserve-3d;
        transition: transform 480ms cubic-bezier(.2,.75,.25,1), box-shadow 220ms ease;
        box-shadow: 0 3px 5px #202a2508, 0 18px 35px #202a2510;
      }

      .flashcard:hover { box-shadow: 0 6px 12px #202a250c, 0 22px 40px #202a2518; }
      .flashcard:focus-visible, .control:focus-visible { outline: 3px solid var(--coral); outline-offset: 4px; }
      .flashcard.is-flipped { transform: rotateY(180deg); }

      .face {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 30px 20px;
        border-radius: 8px;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }

      .face-front {
        background-color: var(--white);
        background-image: linear-gradient(135deg, #fffefa 0%, #fffefa 76%, #f5f1e6 76%, #f5f1e6 100%);
      }

      .face-back {
        background: var(--green);
        color: var(--white);
        transform: rotateY(180deg);
      }

      .face-label {
        margin-bottom: 18px;
        color: var(--coral);
        font-size: 0.68rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .face-back .face-label { color: var(--yellow); }

      .word {
        max-width: 100%;
        overflow-wrap: anywhere;
        font-family: var(--serif);
        font-size: 3.4rem;
        font-weight: 600;
        line-height: 1.05;
      }

      .pronunciation {
        margin-top: 14px;
        color: var(--muted);
        font-size: 1rem;
      }

      .translation {
        max-width: 100%;
        overflow-wrap: anywhere;
        font-family: var(--serif);
        font-size: 2.6rem;
        font-weight: 500;
        line-height: 1.1;
      }

      .turn-mark {
        position: absolute;
        right: 20px;
        bottom: 17px;
        color: #878c7e;
        font-size: 0.7rem;
        font-weight: 600;
      }

      .face-back .turn-mark { color: #d1dece; }

      .controls {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 12px;
        margin-top: 20px;
      }

      .control {
        min-height: 46px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 15px;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--ink);
        background: #fffefa;
        cursor: pointer;
        font-size: 0.83rem;
        font-weight: 700;
        transition: border-color 160ms ease, background-color 160ms ease, transform 160ms ease;
      }

      .control:hover { border-color: var(--green); background: #f0f2e9; }
      .control:active { transform: translateY(1px); }
      .control svg { width: 16px; height: 16px; }
      .control-nav:first-child { justify-self: start; }
      .control-nav:last-child { justify-self: end; }

      .deck-note {
        margin: 22px 0 0;
        color: var(--muted);
        font-size: 0.76rem;
        text-align: center;
      }

      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-top: 15px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.7rem;
      }

      .footer-mark { color: var(--green); font-weight: 700; }

      @keyframes arrive {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 520px) {
        .page { width: min(100% - 32px, 760px); padding-top: 22px; }
        main { padding: 38px 0 32px; }
        h1 { font-size: 2.1rem; }
        .card-wrap { height: 270px; }
        .word { font-size: 3rem; }
        .translation { font-size: 2.2rem; }
        .control { min-height: 44px; padding: 0 11px; }
        .control-shuffle { width: 46px; padding: 0; }
        .control-shuffle span { display: none; }
        .deck-note { min-height: 1em; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topline">
        <div class="wordmark"><span class="wordmark-icon" aria-hidden="true">a</span><span>You Say Hola</span></div>
        <span class="level">LEVEL A1</span>
      </header>

      <main>
        <div class="intro">
          <p class="eyebrow">A little Spanish, every day</p>
          <h1>Build your word power.</h1>
          <p class="subtitle">A1 Spanish vocabulary practice deck</p>
        </div>

        <div class="progress-row" aria-live="polite">
          <span id="counter">Card 1 of 20</span>
          <span id="progress-label">5% complete</span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Deck progress" aria-valuemin="1" aria-valuemax="20" aria-valuenow="1">
          <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div class="card-wrap">
          <button class="flashcard" id="flashcard" type="button" aria-pressed="false" aria-label="Reveal the English translation">
            <span class="face face-front" id="front-face">
              <span class="face-label">Spanish</span>
              <span class="word" id="word">Cargando...</span>
              <span class="pronunciation" id="pronunciation"></span>
              <span class="turn-mark" aria-hidden="true">Tap to reveal</span>
            </span>
            <span class="face face-back" id="back-face" aria-hidden="true">
              <span class="face-label">English</span>
              <span class="translation" id="translation"></span>
              <span class="turn-mark" aria-hidden="true">Tap to return</span>
            </span>
          </button>
        </div>

        <div class="controls" aria-label="Deck controls">
          <button class="control control-nav" id="previous" type="button" aria-label="Previous card">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            <span>Previous</span>
          </button>
          <button class="control control-shuffle" id="shuffle" type="button" aria-label="Shuffle deck" title="Shuffle deck">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h2.5a6 6 0 0 0 4.2-1.7L17.3 7.7A6 6 0 0 1 21.5 6H22"/><path d="M2 6h2.5a6 6 0 0 1 4.2 1.7l1.1 1.1"/><path d="M14.2 14.2l3.1 3.1a6 6 0 0 0 4.2 1.7h.5"/></svg>
            <span>Shuffle</span>
          </button>
          <button class="control control-nav" id="next" type="button" aria-label="Next card">
            <span>Next</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
        <p class="deck-note" id="deck-note" aria-live="polite"></p>
      </main>

      <footer>
        <span>20 everyday words</span>
        <span class="footer-mark">Espa&ntilde;ol &bull; English</span>
      </footer>
    </div>

    <script>
      const vocab = [
        { es: "abrir", pron: "ah-BREER", en: "to open" },
        { es: "agua", pron: "AH-gwa", en: "water" },
        { es: "bailar", pron: "bai-LAR", en: "to dance" },
        { es: "ba\u00f1o", pron: "BAN-yo", en: "bathroom" },
        { es: "casa", pron: "KA-sa", en: "house" },
        { es: "dormir", pron: "dor-MEER", en: "to sleep" },
        { es: "escuela", pron: "es-KWE-la", en: "school" },
        { es: "feliz", pron: "fe-LEES", en: "happy" },
        { es: "gato", pron: "GA-to", en: "cat" },
        { es: "hablar", pron: "a-BLAR", en: "to speak" },
        { es: "libro", pron: "LEE-bro", en: "book" },
        { es: "madre", pron: "MA-dre", en: "mother" },
        { es: "padre", pron: "PA-dre", en: "father" },
        { es: "alto", pron: "AL-to", en: "tall" },
        { es: "bajo", pron: "BA-ho", en: "short" },
        { es: "lunes", pron: "LOO-nes", en: "Monday" },
        { es: "rojo", pron: "RO-ho", en: "red" },
        { es: "abogado", pron: "ah-bo-GAH-do", en: "lawyer" },
        { es: "aburrido", pron: "ah-boo-REE-do", en: "bored" },
        { es: "amigo", pron: "ah-MEE-go", en: "friend" }
      ];

      let deck = [...vocab];
      let currentIndex = 0;
      let isFlipped = false;

      const flashcard = document.getElementById("flashcard");
      const frontFace = document.getElementById("front-face");
      const backFace = document.getElementById("back-face");
      const counter = document.getElementById("counter");
      const progressLabel = document.getElementById("progress-label");
      const progress = document.querySelector(".progress-track");
      const progressFill = document.getElementById("progress-fill");
      const deckNote = document.getElementById("deck-note");

      function renderCard() {
        const item = deck[currentIndex];
        const percent = Math.round(((currentIndex + 1) / deck.length) * 100);
        document.getElementById("word").textContent = item.es;
        document.getElementById("pronunciation").textContent = item.pron;
        document.getElementById("translation").textContent = item.en;
        counter.textContent = `Card ${currentIndex + 1} of ${deck.length}`;
        progressLabel.textContent = `${percent}% complete`;
        progress.setAttribute("aria-valuenow", String(currentIndex + 1));
        progressFill.style.width = `${percent}%`;
        setFlipped(false);
      }

      function setFlipped(flipped) {
        isFlipped = flipped;
        flashcard.classList.toggle("is-flipped", isFlipped);
        flashcard.setAttribute("aria-pressed", String(isFlipped));
        flashcard.setAttribute("aria-label", isFlipped ? "Hide the English translation" : "Reveal the English translation");
        frontFace.setAttribute("aria-hidden", String(isFlipped));
        backFace.setAttribute("aria-hidden", String(!isFlipped));
      }

      function flipCard() {
        setFlipped(!isFlipped);
      }

      function nextCard() {
        currentIndex = (currentIndex + 1) % deck.length;
        deckNote.textContent = "";
        renderCard();
      }

      function prevCard() {
        currentIndex = (currentIndex - 1 + deck.length) % deck.length;
        deckNote.textContent = "";
        renderCard();
      }

      function shuffleDeck() {
        for (let index = deck.length - 1; index > 0; index--) {
          const swapIndex = Math.floor(Math.random() * (index + 1));
          [deck[index], deck[swapIndex]] = [deck[swapIndex], deck[index]];
        }
        currentIndex = 0;
        deckNote.textContent = "Deck shuffled";
        renderCard();
      }

      flashcard.addEventListener("click", flipCard);
      document.getElementById("previous").addEventListener("click", prevCard);
      document.getElementById("next").addEventListener("click", nextCard);
      document.getElementById("shuffle").addEventListener("click", shuffleDeck);
      document.addEventListener("keydown", (event) => {
        if (event.altKey || event.ctrlKey || event.metaKey) return;
        if (event.key === "ArrowLeft") {
          event.preventDefault();
          prevCard();
        } else if (event.key === "ArrowRight") {
          event.preventDefault();
          nextCard();
        } else if (event.key === "Escape" && isFlipped) {
          setFlipped(false);
        }
      });

      renderCard();
    </script>
  </body>
</html>
